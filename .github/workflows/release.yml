name: Build/Release

on:
  push:
    tags:
      - 'v*'
    branches: [ master, feature/inmp441-i2s-audio ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      BUILDROOT_DIR: 'buildroot'

    strategy:
      fail-fast: false
      matrix:
        raspberry: ['raspberrypi0', 'raspberrypi0w']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set build version identifiers
        run: |
          echo "SMW_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
          echo "BUILDROOT_VERSION=$(git -C buildroot rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Cache Build
        id: restore-cache
        uses: actions/cache@v4
        with:
          path: |
            output
            buildroot
          key: ${{ matrix.raspberry }}-${{ env.BUILDROOT_DIR }}-${{ env.BUILDROOT_VERSION }}-inmp441-${{ hashFiles('board/linux-base.config', 'configs/config', 'board/inmp441-overlay.dts', 'board/post-image.sh') }}

      - name: Blocked mirror workaround
        run: echo "127.0.0.1 invisible-mirror.net" | sudo tee -a /etc/hosts

      - name: Build Image
        run: |
          rm -fr output/*/build/piwebcam*
          sh build-showmewebcam.sh ${{ matrix.raspberry }}
          test -x "output/${{ matrix.raspberry }}/target/usr/bin/arecord"
          test -s "output/${{ matrix.raspberry }}/images/rpi-firmware/overlays/inmp441.dtbo"
          cp output/${{ matrix.raspberry }}/images/sdcard.img sdcard-${{ matrix.raspberry }}-${{ env.SMW_VERSION }}.img

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: sdcard-${{ matrix.raspberry }}-${{ env.SMW_VERSION }}.img
          path: sdcard-${{ matrix.raspberry }}-${{ env.SMW_VERSION }}.img

      - name: Prepare Release Image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp output/${{ matrix.raspberry }}/images/sdcard.img sdcard-${{ matrix.raspberry }}-${{ env.SMW_VERSION }}.img
          gzip sdcard-${{ matrix.raspberry }}-${{ env.SMW_VERSION }}.img

      - name: Store Release Image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.raspberry }}
          path: sdcard-${{ matrix.raspberry }}-${{ env.SMW_VERSION }}.img.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Changelog
        run: |
          cat << EOF > CHANGELOG.md
          What's new:

          EOF
          git log $(git describe --tags --abbrev=0 HEAD^)..${{ github.ref }} --no-merges --pretty=format:"- %s" >> CHANGELOG.md

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums file
        run: |
          cd release-assets
          sha256sum sdcard* > CHECKSUMS.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
